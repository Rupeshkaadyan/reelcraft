<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Reelcraft screen review</title>
  <style>
    body { background:#0a0a0c; color:#f7f7f5; font-family:-apple-system,BlinkMacSystemFont,sans-serif; margin:0; padding:24px; }
    h1 { font-size:20px; margin:0 0 4px; }
    p.sub { color:#9a9aa5; font-size:13px; margin:0 0 20px; }
    .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(240px,1fr)); gap:20px; }
    figure { margin:0; background:#141419; border:1px solid #2a2a33; border-radius:14px; overflow:hidden; }
    figure img { width:100%; display:block; }
    figcaption { padding:10px 12px; font-size:12px; color:#9a9aa5; }
    .icon { max-width:220px; }
  </style>
</head>
<body>
  <h1>Reelcraft screen review</h1>
  <p class="sub">Captured from the iPhone 17 Pro simulator, seeded with demo projects.</p>
  <div class="grid">
    <figure><img src="screens/projects.png"><figcaption>Projects library</figcaption></figure>
    <figure><img src="screens/editor.png"><figcaption>Editor — timeline and preview</figcaption></figure>
    <figure><img src="screens/ideas.png"><figcaption>Ideas stickies</figcaption></figure>
    <figure><img src="screens/discover.png"><figcaption>Discover templates + sound packs</figcaption></figure>
    <figure><img src="screens/insights.png"><figcaption>Insights dashboard</figcaption></figure>
    <figure><img src="screens/record.png"><figcaption>Record tab (simulator, no camera)</figcaption></figure>
    <figure><img class="icon" src="icon-512.png"><figcaption>App icon</figcaption></figure>
    <figure><img src="wallpaper-1290x2796.png"><figcaption>Launch / marketing wallpaper</figcaption></figure>
  </div>
</body>
</html>
