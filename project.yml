name: Reelcraft
options:
  bundleIdPrefix: com.reelcraft
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_EMIT_LOC_STRINGS: YES

targets:
  Reelcraft:
    type: application
    platform: iOS
    sources:
      - path: Reelcraft
        excludes:
          - "Info.plist"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.reelcraft.app
        PRODUCT_NAME: Reelcraft
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: NO
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
    info:
      path: Reelcraft/Info.plist
      properties:
        CFBundleDisplayName: Reelcraft
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "1"
        UILaunchScreen:
          UIColorName: LaunchBackground
          UIImageName: ""
        UIUserInterfaceStyle: Dark
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        NSCameraUsageDescription: Reelcraft uses the camera to record clips for your projects.
        NSMicrophoneUsageDescription: Reelcraft records audio with your clips and voiceovers.
        NSPhotoLibraryAddUsageDescription: Reelcraft saves your finished videos to your photo library.
        NSPhotoLibraryUsageDescription: Reelcraft imports videos you choose from your photo library.
        NSSpeechRecognitionUsageDescription: Reelcraft transcribes your clips on device to create captions.
        ITSAppUsesNonExemptEncryption: false

  ReelcraftTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: ReelcraftTests
    dependencies:
      - target: Reelcraft
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.reelcraft.app.tests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  Reelcraft:
    build:
      targets:
        Reelcraft: all
        ReelcraftTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - ReelcraftTests
    archive:
      config: Release
